app = "ai-heatmap"
primary_region = "iad"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
timeout = "5s"
method = "get"
path = "/health"

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
